<div class="login-wrapper">
  <div style="position: absolute; top: 20px; right: 20px">
    <button
      class="btn"
      style="padding: 0.5rem 1rem; border-radius: 20px"
      (click)="idioma.toggle()"
    >
      🌐 {{ idioma.idiomaActual() }}
    </button>
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="icon">⚽</span>
      <h1>Matchday Hero</h1>
    </div>

    @if (errorMessage) {
    <div
      class="alert-error"
      style="
        color: #ef4444;
        border: 1px solid #ef4444;
        padding: 0.5rem;
        text-align: center;
        margin-bottom: 1rem;
      "
    >
      {{ errorMessage }}
    </div>
    }

    <form (ngSubmit)="onSubmit()" novalidate>
      <input
        type="text"
        [(ngModel)]="email"
        name="email"
        class="input-field"
        placeholder="Correo"
        required
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        class="input-field"
        placeholder="Contraseña"
        required
      />

      <button type="submit" class="btn full-width" [disabled]="isLoading">
        {{ isLoading ? 'Entrando...' : 'Saltar al campo' }}
      </button>

      <p style="text-align: center; margin-top: 1rem">
        ¿No tienes cuenta?
        <a routerLink="/register" style="color: var(--primary)"
          >Regístrate aquí</a
        >
      </p>
    </form>
  </div>
</div>
