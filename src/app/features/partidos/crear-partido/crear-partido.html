<div class="crear-wrapper">
  <div class="crear-card">
    <h2>{{ idioma.idiomaActual() === 'ES' ? 'Organizar Nuevo Partido' : 'Partida Berria Antolatu' }}</h2>
    <p class="subtitle">{{ idioma.idiomaActual() === 'ES' ? 'Rellena los datos para encontrar a los jugadores que te faltan.' : 'Bete datuak falta zaizkizun jokalariak aurkitzeko.' }}</p>

    <form (ngSubmit)="onSubmit()" #partidoForm="ngForm">
      <div class="form-group">
        <label for="ubicacion">{{ idioma.idiomaActual() === 'ES' ? 'Ubicación / Polideportivo' : 'Kokalekua / Kiroldegia' }}</label>
        <input type="text" id="ubicacion" name="ubicacion" [(ngModel)]="ubicacion" class="input-field" placeholder="Ej: Polideportivo Municipal" required>
      </div>

      <div class="grid-2-cols">
        <div class="form-group">
          <label for="fecha">{{ idioma.idiomaActual() === 'ES' ? 'Día' : 'Eguna' }}</label>
          <input type="date" id="fecha" name="fecha" [(ngModel)]="fecha" class="input-field" required>
        </div>
        <div class="form-group">
          <label for="hora">{{ idioma.idiomaActual() === 'ES' ? 'Hora' : 'Ordua' }}</label>
          <input type="time" id="hora" name="hora" [(ngModel)]="hora" class="input-field" required>
        </div>
      </div>

      <div class="form-group">
        <label for="posiciones">{{ idioma.idiomaActual() === 'ES' ? 'Posiciones Buscadas (separadas por coma)' : 'Bilatutako posizioak (komaz bananduta)' }}</label>
        <input type="text" id="posiciones" name="posiciones" [(ngModel)]="posicionesInput" class="input-field" required>
      </div>

      <div class="button-group">
        <button type="button" class="btn-outline" (click)="cancelar()">{{ idioma.idiomaActual() === 'ES' ? 'Cancelar' : 'Ezeztatu' }}</button>
        <button type="submit" class="btn" [disabled]="isLoading || !partidoForm.form.valid">
          {{ idioma.idiomaActual() === 'ES' 
             ? (isLoading ? 'Publicando...' : 'Publicar Partido') 
             : (isLoading ? 'Argitaratzen...' : 'Partida Argitaratu') }}
        </button>
      </div>
    </form>
  </div>
</div>
