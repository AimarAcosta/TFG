<div class="container">
  <div
    class="card-partido"
    style="max-width: 600px; margin: 0 auto; padding: 2rem"
  >
    <h2 style="margin-bottom: 1.5rem; text-align: center">
      {{ idioma.idiomaActual() === 'ES' ? 'Organizar Nuevo Partido' : 'Partida
      Berria Antolatu' }}
    </h2>

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group" style="margin-bottom: 1.5rem">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold">
          {{ idioma.idiomaActual() === 'ES' ? 'Ubicación (Gran Bilbao)' :
          'Kokalekua (Bilbo Handia)' }}
        </label>
        <select
          [(ngModel)]="partido.ubicacion"
          name="ubicacion"
          class="input-field"
          style="
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
          "
        >
          @for (ubi of ubicaciones; track ubi) {
          <option [value]="ubi">{{ ubi }}</option>
          }
        </select>
      </div>

      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem">
        <div class="form-group" style="flex: 1">
          <label
            style="display: block; margin-bottom: 0.5rem; font-weight: bold"
          >
            {{ idioma.idiomaActual() === 'ES' ? 'Fecha' : 'Data' }}
          </label>
          <input
            type="date"
            [(ngModel)]="partido.fecha"
            name="fecha"
            class="input-field"
            style="width: 100%; box-sizing: border-box"
            required
          />
        </div>
        <div class="form-group" style="flex: 1">
          <label
            style="display: block; margin-bottom: 0.5rem; font-weight: bold"
          >
            {{ idioma.idiomaActual() === 'ES' ? 'Hora' : 'Ordua' }}
          </label>
          <input
            type="time"
            [(ngModel)]="partido.hora"
            name="hora"
            class="input-field"
            style="width: 100%; box-sizing: border-box"
            required
          />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 2rem">
        <label style="display: block; margin-bottom: 1rem; font-weight: bold">
          {{ idioma.idiomaActual() === 'ES' ? '¿Qué posiciones faltan?' : 'Zein
          posizio falta dira?' }}
        </label>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
          @for (pos of posicionesDisponibles; track pos) {
          <button
            type="button"
            class="tag"
            (click)="togglePosicion(pos)"
            style="
              cursor: pointer;
              padding: 0.5rem 1rem;
              border-radius: 20px;
              border: 1px solid var(--primary);
              transition: all 0.2s;
            "
            [style.background-color]="partido.posiciones_necesitadas.includes(pos) ? 'var(--primary)' : 'transparent'"
            [style.color]="partido.posiciones_necesitadas.includes(pos) ? 'white' : 'var(--text-main)'"
          >
            {{ pos }}
          </button>
          }
        </div>
      </div>

      <button type="submit" class="btn full-width" [disabled]="isSubmitting">
        {{ idioma.idiomaActual() === 'ES' ? (isSubmitting ? 'Organizando...' :
        'Crear Partido') : (isSubmitting ? 'Antolatzen...' : 'Partida Sortu') }}
      </button>
    </form>
  </div>
</div>
